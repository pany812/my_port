# P2-M4: "what would it have to earn?" (Black–Litterman breakeven, the SAA as the prior),
# "what weight does a view give?", and CMA expected returns next to historical means.
# Run: wb run specs/example_black_litterman.yaml
experiment: synthetic_trend_black_litterman_v1
seed: 42
data:
  source: synthetic
  frequency: M
  start: 2006-01
  end: 2026-09
  base_currency: SEK
  hedging: "synthetic placeholder: fixed income SEK-hedged, equity and real assets unhedged"
  candidate: CAND
  synthetic:
    mu_annual: 0.05
    vol_annual: 0.10
    corr_to_equity: -0.1
    skew: 0.3
    live_start: 2016-01
    tail_df: 6
saa:
  version: example
rf_annual: 0.02                    # = the cash block's mean: excess over rf ~ excess over cash
window: {kind: rolling, periods: 120}
rebalance: {kind: calendar, every: Q}
solvers: [CLARABEL, SCS]
cma: {version: placeholder}        # synthetic truth (an oracle): testing the plumbing only
grid:
  estimators:
    - {method_mu: hist, method_cov: ledoit}
    - {method_mu: cma, method_cov: ledoit}
  allocators:
    - {type: static_saa}
    - {type: riskfolio_mean_risk, rm: [MV], obj: [Sharpe]}
    - {type: skfolio_mean_risk, rm: [MV], obj: [Sharpe]}
    # breakeven: the expected excess return the candidate needs for each weight
    - {type: riskfolio_bl, target_weight: [0.02, 0.05, 0.10, 0.15], method_cov: ledoit}
    - {type: skfolio_bl, target_weight: [0.02, 0.05, 0.10, 0.15], method_cov: ledoit}
    # view mode: the weight a stated view gives, at two confidences
    - type: riskfolio_bl
      view_annual: [0.0, 0.01, 0.02, 0.03]
      confidence: [0.5, 1.0]
      method_cov: ledoit
  constraint_sets:
    - {name: te, te_annual: {sweep: [0.01, 0.02]}, candidate_cap: 0.25}
    - {name: ranges, asset_ranges: true, candidate_cap: 0.25}
    - {name: band, band: 0.05, candidate_cap: 0.10}
risk_lenses: [MV, CVaR]

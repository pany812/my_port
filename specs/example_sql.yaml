# P2-M8: the SQL data source through the data contract (docs/DATA_CONTRACT.md) with a file-based
# SAA version. Try it on the demo database built from the synthetic market:
#   wb data demo                                   # writes out/demo_data.db
#   export WB_DATA_URL=sqlite:///out/demo_data.db
#   wb data check specs/example_sql.yaml && wb run specs/example_sql.yaml
# With real data: point WB_DATA_URL at PostgreSQL (read-only role) and use the house SAA file.
experiment: sql_demo_v1
seed: 42
data:
  source: sql
  frequency: M
  start: 2001-01
  end: 2026-09
  base_currency: SEK
  hedging: "synthetic placeholder: fixed income SEK-hedged, equity and real assets unhedged"
  candidate: CAND
  sql:
    url_env: WB_DATA_URL          # the URL lives in the environment, never in the spec
    vintage: latest               # or a tag, e.g. "2026-10-01T06:00"
    live_start: 2016-01           # earlier candidate periods are backfilled
    candidate_proxy: CAND_PROXY   # spliced in before live_start, flagged
saa:
  version: synthetic_example      # saa/synthetic_example.yaml
window: {kind: rolling, periods: 60}
rebalance: {kind: calendar, every: Q}
grid:
  estimators:
    - {method_mu: hist, method_cov: ledoit}
  allocators:
    - {type: static_saa}
    - {type: saa_plus, x: [0.02, 0.05]}
    - {type: riskfolio_mean_risk, rm: [MV, CVaR], obj: [Sharpe, MinRisk]}
    - {type: riskfolio_hc, model: [HRP]}
  constraint_sets:
    - {name: te_2pct, te_annual: 0.02, candidate_cap: 0.10}
risk_lenses: [MV, CVaR, CDaR]

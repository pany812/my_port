[project]
name = "workbench"
version = "0.1.0"
description = "Portfolio construction workbench: allocation corridors for candidate strategies vs the SAA"
requires-python = ">=3.11"
dependencies = [
    "riskfolio-lib==7.4.0",
    "numpy",
    "pandas",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]
